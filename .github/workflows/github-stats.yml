name: Update GitHub Stats Card

on:
  push:
    branches:
      - main

jobs:
  update-stats-card:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Generate GitHub Stats Card URL
        run: |
          echo "![Anurag's GitHub stats](https://github-readme-stats.vercel.app/api?username=MStauros&count_private=true&show_icons=true&token=${{ secrets.GH_TOKEN }})" > github-stats-url.txt
      
      - name: Update README with new GitHub Stats Card URL
        run: |
          sed -i 's|!\\[Anurag\'s GitHub stats\\](.*)|!\\[Anurag\'s GitHub stats\\]('$(cat github-stats-url.txt)')|' README.md
          
      - name: Commit and push changes to README
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update GitHub Stats Card"
          git push
